# Database Connection Configuration
# Primary: MySQL Database
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/payroll_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.user=root
db.password=

# Embedded Database Fallback (H2 in MySQL mode)
# Automatically utilized if MySQL is not running on localhost:3306.
# Relative ./data paths are remapped to ~/.payroll-system/data at runtime.
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:./data/payroll_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.fallback.user=sa
db.fallback.password=

# Auto initialization of schema & sample data if tables are missing
db.auto.init=true
db.allow.fallback=true
